[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=itlives Live Wallpaper Browser
Author=itlives
Information=Browse and set Live Wallpapers directly from your desktop.
Version=1.0

[Variables]
; Styling Variables
BgColor=15,15,15,220
BorderColor=255,255,255,40
HoverColor=255,170,0,255
TextColor=255,255,255,255
FontFamily=Segoe UI
CornerRadius=8

[StyleBackground]
SolidColor=#BgColor#
Shape=Rectangle 0,0,220,60,#CornerRadius# | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#

[MeterBackground]
Meter=Shape
MeterStyle=StyleBackground
MouseOverAction=[!SetOption MeterBackground Shape "Rectangle 0,0,220,60,#CornerRadius# | Fill Color 30,30,30,240 | StrokeWidth 1 | Stroke Color #HoverColor#"][!UpdateMeter MeterBackground][!Redraw]
MouseLeaveAction=[!SetOption MeterBackground Shape "Rectangle 0,0,220,60,#CornerRadius# | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#"][!UpdateMeter MeterBackground][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureRun "Run"]

[MeterIcon]
Meter=String
FontFace=Segoe MDL2 Assets
FontSize=18
FontColor=#HoverColor#
X=20
Y=30
StringAlign=LeftCenter
Text=[\xE8B9]
AntiAlias=1

[MeterText]
Meter=String
FontFace=#FontFamily#
FontSize=11
FontWeight=600
FontColor=#TextColor#
X=50
Y=30
StringAlign=LeftCenter
Text=Browse Wallpaper
AntiAlias=1

[MeasureRun]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -WindowStyle Hidden -ExecutionPolicy Bypass -File "#@#BrowseAndSet.ps1"
State=Hide
OutputType=ANSI
