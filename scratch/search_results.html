<!DOCTYPE html>
<html lang='en-US'>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    	<title>404 Not Found</title>
        <link rel="apple-touch-icon" sizes="180x180" href="https://static.alphacoders.com/icons/apple-touch-icon.png">
        <link rel="icon" type="image/png" href="https://static.alphacoders.com/icons/favicon-32x32.png" sizes="32x32">
        <link rel="icon" type="image/png" href="https://static.alphacoders.com/icons/favicon-16x16.png" sizes="16x16">
        <link rel="manifest" href="https://static.alphacoders.com/icons/manifest.json">
        <link rel="mask-icon" href="https://static.alphacoders.com/icons/safari-pinned-tab.svg" color="#000000">
        <link rel="shortcut icon" href="https://static.alphacoders.com/icons/favicon.ico">
        <meta name="apple-mobile-web-app-title" content="Alpha Coders">
        <meta name="application-name" content="Alpha Coders">
        <meta name="msapplication-TileColor" content="#ffffff">
        <meta name="msapplication-TileImage" content="https://static.alphacoders.com/icons/mstile-144x144.png">
        <meta name="msapplication-config" content="https://static.alphacoders.com/icons/browserconfig.xml">
        <meta name="theme-color" content="#ffffff">
    </head>
    <style>

        .blue {
            color:#279AEB;
        }

        .btn-search {
            border-radius: 0 4px 4px 0;
            margin-left: -10px;
        }

        .center {
            text-align: center;
        }

        .container {
            max-width:1200px;
            margin:0 auto;
            display:flex;
            line-height: 1.5;
        }


        .navbar {
				background-color: #222;
				border-color: #080808;
				padding: 15px;
				border-top: 1px solid transparent;
				box-shadow: 0px 2px 7px 4px rgba(0, 0, 0, 0.25);
				font-size: 26px;
				display: flex;
				align-items: center;
        }

        .navbar > span {
            flex: 1;
            margin-right: 20px;
        }
        .navbar-form {
            margin-top: -5px;
            white-space: nowrap;
        }

        .search {
				color: #555;
				border-radius: 4px 0 0 4px;
				-webkit-transition: border-color ease-in-out .15s, -webkit-box-shadow ease-in-out .15s;
				-o-transition: border-color ease-in-out .15s, box-shadow ease-in-out .15s;
				transition: border-color ease-in-out .15s, box-shadow ease-in-out .15s;
				width: 250px;
        }
        .search, .btn-search {
            padding: 6px 12px;
            font-size: 14px;
            line-height: 1.42857143;
            background: white;
            border: 1px solid #ccc;
            -webkit-box-shadow: inset 0 1px 1px rgba(0,0,0,0.075);
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.075);
        }

        .shadow {
            text-shadow: 2px 2px black;
        }

        .title {
            font-size:8em;
        }

        .white{
				color:#D9D9D9;
        }

        html, body{
            height:100%;padding:0;margin:0;
        }

        a.undecorated {
            text-decoration:none;
        }

        body {
            background: black;
            background: url('https://static.alphacoders.com/crt_monitor_1920.jpg') center;
            background-size: cover;
            height: 100%;
            font-family: "Helvetica Neue",Helvetica,Arial,sans-serif;
        }

        div.box-see-through {
            background-color: rgba(36, 37, 38, 0.85);
            border-radius:8px;
            padding:10px;
            margin-top:20px;
            margin-bottom:20px;
        }

        div.row { 
            width:100%;
        }

        @media (max-width:700px) {
            .navbar {
                flex-direction: column;
            }
            .navbar-form {
                margin-top: 10px;
            }

            .title {
                font-size:4em;
            }
        }
    </style>

    <body>
        <header class="navbar">
			<span>
				<a class="undecorated" href="https://alphacoders.com"><span class='blue'>Alpha</span> <span class="white">Coders</span></a>
			</span>
			<form class="navbar-form navbar-right" role="search" action="https://alphacoders.com/search/view">
				<input type="text" class="search" name='q' placeholder="Search Alpha Coders">
				<button type="submit" class="btn-search">🔍</button>
			</form>
			<div class="clearfix"></div>
		</header>

        <br><br><br>
        <h1 class="white center title shadow">404 Not Found</h1>


        
        <div class="container">
            <div class="row">
                <div class="center">

                    <div class="box-see-through">
                        <h1 class="white center shadow">Try Searching or go to <a class="white" href="https://alphacoders.com">Alpha Coders home page</a></h1>

                        <h3 class="white">
                            If you believe this page does exist, and is returning 404 Not Found incorrectly, please email us at admin@alphacoders.com, or chat with us on 
                            our <a class="white" href="https://discord.gg/5WMUMa8" target="_blank">Discord</a>, and give us the exact URL from your browser.
                        </span>
                    </div>
                </div>
            </div>
        </div>




    </body>
</html>
