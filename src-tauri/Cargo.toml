[package]
name = "app"
version = "0.1.3"
description = "itLives Live Wallpaper - Lightweight Desktop Video Wallpaper"
authors = ["itLives"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "app"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
log = "0.4"
tauri = { version = "2.11.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
async-trait = "0.1"
tauri-plugin-dialog = "2"
urlencoding = "2.1.3"
regex = "1.12.3"
lazy_static = "1.4"
image = "0.24"
cpal = "0.17.1"
rustfft = "6.4.1"
windows = { version = "0.58", features = ["Media_Control", "Foundation", "Storage_Streams", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility"] }
tauri-plugin-http = "2"
env_logger = "0.11.10"
sha2 = "0.10"
tauri-plugin-updater = "2.10.1"
chrono = "0.4.45"
tauri-plugin-process = "2.3.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Debug",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Memory",
] }
