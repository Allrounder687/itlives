[package]
name = "app"
version = "0.1.0"
description = "OpenClaw Live Wallpaper - Lightweight Desktop Video Wallpaper"
authors = ["OpenClaw"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
async-trait = "0.1"
tauri-plugin-dialog = "2"
urlencoding = "2.1.3"
regex = "1.12.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Debug",
] }
